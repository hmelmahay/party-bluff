# Manual backup deploy:  Actions tab -> deploy -> Run workflow pings Render's
# deploy hook.  It doesn't run on push because Render already deploys every push
# to main by itself, so a push trigger here sends a second deploy per merge.
# No-ops (green) until the RENDER_DEPLOY_HOOK secret is set in repo settings:
# Render dashboard -> party-bluff service -> Settings -> Deploy Hook -> copy URL,
# then GitHub -> Settings -> Secrets and variables -> Actions -> new secret.
name: deploy
on:
  workflow_dispatch: {}
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsS "$RENDER_DEPLOY_HOOK" && echo "deploy triggered"
          else
            echo "RENDER_DEPLOY_HOOK secret not set yet — skipping (deploy manually)"
          fi
