name: Deploy to Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set - skipping (add it to enable auto-deploy)"
            exit 0
          fi
          curl -fsS "$HOOK" > /dev/null
          echo "Render deploy triggered"
